[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "terminai"
version = "0.1.0-alpha"
description = "Terminal-native, local-first, voice-capable personal AI assistant"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["ai", "assistant", "terminal", "cli", "llm", "voice"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

dependencies = [
    "prompt_toolkit>=3.0",
    "colorama>=0.4",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
    "notion-client>=2.0",
    "dateparser>=1.2",
    "pytz>=2024.1",
]

[project.optional-dependencies]
# Local LLM support
ollama = []                              # Ollama runs as a separate process; no Python dep needed

# Cloud LLM providers
gemini   = ["google-generativeai>=0.8"]
openai   = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
deepseek  = ["openai>=1.0"]             # DeepSeek uses the OpenAI-compatible API

# Voice
voice = [
    "speechrecognition>=3.10",
    "pygame>=2.5",
    "openai-whisper",
    "elevenlabs>=1.0",
    "pyaudio",
]

# Calendar
google-calendar = [
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
]
caldav = ["caldav>=1.3", "icalendar>=5.0"]

# Memory (Sprint 3)
memory = ["chromadb>=0.4"]

# Web UI (Sprint 4)
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "websockets>=12.0"]

# Dev / testing
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.9",
]

# Kitchen sink
all = [
    "terminai[gemini,openai,anthropic,voice,google-calendar,caldav,memory,web]",
]

[project.scripts]
terminai = "terminal_agent.main:main"

[project.entry-points."terminai.plugins"]
notion   = "terminal_agent.plugins.builtin.notion_plugin:NotionPlugin"
voice    = "terminal_agent.plugins.builtin.voice_plugin:VoicePlugin"
calendar = "terminal_agent.plugins.builtin.calendar_plugin:CalendarPlugin"
coding   = "terminal_agent.plugins.builtin.coding_plugin:CodingPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
